name: Build(esp-idf-native)

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**'
      - 'CMakeLists.txt'
      - 'idf_component.yml'
      - '.github/workflows/esp-idf-build-check.yml'
  pull_request:
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**'
      - 'CMakeLists.txt'
      - 'idf_component.yml'
      - '.github/workflows/esp-idf-build-check.yml'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Chip axis: esp32 = classic Xtensa dual-core, esp32s3 = LCD-capable dual-core Xtensa with PSRAM,
# esp32c3 = RISC-V single-core (StampC3), esp32c6 (NanoC6) / esp32h2 (NanoH2) = RISC-V single-core which
# exercises the app_main CONFIG_FREERTOS_UNICORE feedIdle branch, esp32c5 = RISC-V single-core supported from
# IDF 5.5, esp32p4 (M5Stack Tab5) = RISC-V dual-core; the sdkconfig.defaults.esp32p4 overlay is auto-applied.
# esp32s2 is not a target: M5Unified / M5GFX, which the examples use, do not build it.
jobs:
  build-chips:
    name: ${{ matrix.idf }} ${{ matrix.target }} PlotToSerial
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        target: [esp32, esp32s3, esp32c3, esp32c5, esp32c6, esp32h2, esp32p4]
        # idf boundaries: 5.1.7 = oldest legacy-driver (5.0.x dropped: M5GFX needs esp_mm added
        # in 5.1), 5.4.4 = new driver/*_master.h era, 5.5.4 = latest 5.x, 6.1 = latest 6.x
        # (default warnings become errors, GCC 15 / C++26).
        # Every chip is built on every boundary: the chip-specific code (wiring helper, M5Unified / M5GFX,
        # the single core feedIdle branch) and the RISC-V toolchain are not covered by esp32 alone.
        idf: [v5.1.7, v5.4.4, v5.5.4, v6.1]
        exclude:
          - {target: esp32c5, idf: v5.1.7}  # C5 is supported from IDF 5.5 (preview target on 5.4)
          - {target: esp32c5, idf: v5.4.4}
          - {target: esp32p4, idf: v5.1.7}  # P4 is supported from IDF 5.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ESP-IDF build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: examples/UnitUnified/UnitID/PlotToSerial

  # Blinky-Hello-World adds Wi-Fi and the mbedtls TLS client. mbedtls_pk_info_compat.h branches on the IDF
  # version (mbedtls 3.x layouts), so the idf axis is built on esp32, and the Wi-Fi capable chips on 5.5.4.
  # ESP-IDF 6.x is not built: it ships mbedtls 4 (PSA), which the example does not support yet.
  # The built-in ATECC608B of Core2 for AWS (esp32 only) is selected with the Kconfig variant.
  build-examples:
    name: ${{ matrix.idf }} ${{ matrix.target }} ${{ matrix.example }} ${{ matrix.config != '' && 'Core2AWS' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {example: Blinky-Hello-World, target: esp32, idf: v5.5.4, config: ''}
          - {example: Blinky-Hello-World, target: esp32s3, idf: v5.5.4, config: ''}
          - {example: Blinky-Hello-World, target: esp32c6, idf: v5.5.4, config: ''}
          - {example: Blinky-Hello-World, target: esp32, idf: v5.1.7, config: ''}
          - {example: PlotToSerial, target: esp32, idf: v5.5.4, config: 'CONFIG_EXAMPLE_USING_M5CORE2_AWS_BUILTIN=y'}
          - {example: PlotToSerial, target: esp32, idf: v5.1.7, config: 'CONFIG_EXAMPLE_USING_M5CORE2_AWS_BUILTIN=y'}  # legacy driver
          - {example: PlotToSerial, target: esp32, idf: v6.1, config: 'CONFIG_EXAMPLE_USING_M5CORE2_AWS_BUILTIN=y'}
          - {example: Blinky-Hello-World, target: esp32, idf: v5.5.4, config: 'CONFIG_EXAMPLE_USING_M5CORE2_AWS_BUILTIN=y'}
          # The hub example only adds the hub (M5Unit-HUB, example-only dependency) on top of the library
          - {example: ViaPaHub, target: esp32, idf: v5.5.4, config: ''}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Kconfig variant
        # The example's own sdkconfig.defaults is not read (top CMakeLists points SDKCONFIG_DEFAULTS
        # at common/sdkconfig.defaults). Append the choice to common/ in the CI workspace only.
        if: matrix.config != ''
        run: |
          echo "" >> examples/UnitUnified/common/sdkconfig.defaults
          echo "${{ matrix.config }}" >> examples/UnitUnified/common/sdkconfig.defaults

      - name: ESP-IDF build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: examples/UnitUnified/UnitID/${{ matrix.example }}
